<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mercedes-Benz Specifications</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #000000 0%, #111111 50%, #1a1a1a 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      font-weight: 400;
      letter-spacing: -0.022em;
    }

    .status-bar {
      height: 44px;
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(20px);
      border-bottom: 0.5px solid rgba(255,255,255,0.1);
    }

    .time { color: #ffffff; }
    .battery { color: #00ff00; }

    .app-header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      border-bottom: 0.5px solid rgba(255,255,255,0.08);
    }

    .app-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.028em;
    }

    .app-subtitle {
      font-size: 13px;
      color: #888888;
      font-weight: 400;
      letter-spacing: -0.016em;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-container {
      display: none;
    }

    .search-input {
      width: 100%;
      padding: 16px 50px 16px 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
      transform: scale(1.02);
    }

    .search-input::placeholder {
      color: #666666;
    }

    .search-icon {
      display: none;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 30px;
      margin-top: 10px;
    }

    .category-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }

    .category-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .category-card:hover::before {
      opacity: 1;
    }

    .category-card:active {
      transform: scale(0.95);
    }

    .category-card.active {
      background: linear-gradient(145deg, rgba(0,123,255,0.15), rgba(0,123,255,0.08));
      border-color: rgba(0,123,255,0.3);
      transform: scale(1.02);
    }

    .category-icon {
      display: none;
    }

    .category-name {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.026em;
    }

    .models-section {
      display: none;
      animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .models-section.active {
      display: block;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.024em;
    }

    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.1);
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(5px);
      position: relative;
      overflow: hidden;
    }

    .model-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, transparent, #007bff, transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .model-card:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
      border-color: rgba(255,255,255,0.15);
      transform: translateX(8px);
    }

    .model-card:hover::after {
      opacity: 1;
    }

    .model-card:active {
      transform: translateX(4px) scale(0.98);
    }

    .model-name {
      font-size: 17px;
      font-weight: 500;
      background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: -0.019em;
    }

    .chevron {
      font-size: 16px;
      color: #666666;
      transition: transform 0.3s ease;
    }

    .model-card:hover .chevron {
      transform: translateX(4px);
      color: #ffffff;
    }

    .bottom-safe-area {
      height: 34px;
      background: transparent;
    }

    /* Responsive Design */
    @media (min-width: 768px) {
      .container {
        max-width: 600px;
        padding: 30px;
      }
      
      .categories-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      
      .category-card {
        padding: 24px;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 700px;
      }
      
      .categories-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span class="time" id="time">9:41</span>
    <span class="battery">100%</span>
  </div>

  <div class="app-header">
    <h1 class="app-title">Mercedes-Benz</h1>
    <p class="app-subtitle">Product Expert | Primus Autohaus</p>
  </div>

  <div class="container">

    <div id="categoriesView">
      <div class="categories-grid">
        <div class="category-card" onclick="showModels('sedan', 'Sedan')">
          <span class="category-name">Sedan</span>
        </div>
        <div class="category-card" onclick="showModels('coupe', 'Coupe')">
          <span class="category-name">Coupe</span>
        </div>
        <div class="category-card" onclick="showModels('suv', 'SUV')">
          <span class="category-name">SUV</span>
        </div>
        <div class="category-card" onclick="showModels('amg', 'AMG')">
          <span class="category-name">AMG</span>
        </div>
        <div class="category-card" onclick="showModels('ev', 'EV')">
          <span class="category-name">EV</span>
        </div>
        <div class="category-card" onclick="showModels('van', 'Van')">
          <span class="category-name">Van</span>
        </div>
      </div>
    </div>

    <div id="modelsView" class="models-section">
      <div class="section-title">
        <button class="back-btn" onclick="showCategories()">←</button>
        <span id="currentCategory">Models</span>
      </div>
      <div class="models-list" id="modelsList">
        <!-- Models will be populated here -->
      </div>
    </div>
  </div>

  <div class="bottom-safe-area"></div>

  <script>
    const modelsData = {
      sedan: ['A-Class', 'C-Class', 'E-Class', 'S-Class', 'Maybach S-Class'],
      coupe: ['CLE'],
      suv: ['GLA', 'GLC', 'GLC Coupe', 'GLE', 'GLS', 'G-Class'],
      amg: ['AMG CLE 53', 'AMG EQE 53', 'AMG GLE 53', 'AMG SL 43', 'AMG SL 55', 'AMG GT 63'],
      ev: ['EQE Sedan', 'EQE SUV', 'EQS Sedan', 'EQS SUV', 'Maybach EQS SUV'],
      van: ['Vito', 'V-Class', 'Sprinter']
    };

    function updateTime() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}`;
    }

    function showModels(category, categoryName) {
      document.getElementById('categoriesView').style.display = 'none';
      document.getElementById('modelsView').classList.add('active');
      document.getElementById('currentCategory').innerHTML = categoryName;
      
      const modelsList = document.getElementById('modelsList');
      modelsList.innerHTML = '';
      
      modelsData[category].forEach(model => {
        const modelCard = document.createElement('div');
        modelCard.className = 'model-card';
        modelCard.onclick = () => selectModel(model);
        modelCard.innerHTML = `
          <div class="model-name">
            ${model}
            <span class="chevron">→</span>
          </div>
        `;
        modelsList.appendChild(modelCard);
      });
    }

    function showCategories() {
      document.getElementById('modelsView').classList.remove('active');
      document.getElementById('categoriesView').style.display = 'block';
    }

    function selectModel(model) {
      // Add haptic feedback simulation
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
      
      alert(`Selected: ${model}\n\nSpec details would be shown here in the full app.`);
    }

    // Search functionality - disabled
    // document.getElementById('searchInput').addEventListener('input', function(e) {
    //   const query = e.target.value.toLowerCase();
    //   if (query.length > 2) {
    //     console.log('Searching for:', query);
    //   }
    // });

    // Initialize
    updateTime();
    setInterval(updateTime, 1000);

    // Add touch feedback
    document.addEventListener('touchstart', function(e) {
      if (e.target.classList.contains('category-card') || e.target.classList.contains('model-card')) {
        e.target.style.transform = 'scale(0.95)';
      }
    });

    document.addEventListener('touchend', function(e) {
      if (e.target.classList.contains('category-card') || e.target.classList.contains('model-card')) {
        setTimeout(() => {
          e.target.style.transform = '';
        }, 150);
      }
    });
  </script>
</body>
</html>
